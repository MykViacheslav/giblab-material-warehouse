<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magazyn GibLab - Ekran CNC</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }
    .cnc-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .cnc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: #1e1e1e;
      border-bottom: 2px solid #333;
    }
    .cnc-header h1 {
      margin: 0;
      font-size: 1.5rem;
      color: #64ffda;
    }
    .cnc-clock {
      font-size: 1.5rem;
      font-family: monospace;
    }
    .cnc-worker-select {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .cnc-worker-select select, .cnc-worker-select input {
      padding: 0.5rem;
      background: #333;
      color: white;
      border: 1px solid #555;
      border-radius: 4px;
      font-size: 1rem;
    }
    .cnc-content {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .cnc-queue {
      flex: 1;
      border-right: 2px solid #333;
      display: flex;
      flex-direction: column;
    }
    .cnc-queue h2 {
      padding: 1rem;
      margin: 0;
      background: #252525;
      border-bottom: 1px solid #333;
    }
    .cnc-job-list {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .cnc-job-card {
      background: #2a2a2a;
      border-left: 4px solid #666;
      padding: 1rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .cnc-job-card:hover {
      background: #333;
    }
    .cnc-job-card.active {
      border-left-color: #64ffda;
      background: #20332e;
    }
    .cnc-job-card h3 {
      margin: 0 0 0.5rem 0;
      font-size: 1.2rem;
    }
    .cnc-job-card p {
      margin: 0;
      color: #aaa;
      font-size: 0.9rem;
    }
    .cnc-details {
      flex: 2;
      display: flex;
      flex-direction: column;
      background: #181818;
    }
    .cnc-details-header {
      padding: 1.5rem;
      background: #252525;
      border-bottom: 1px solid #333;
    }
    .cnc-details-header h2 {
      margin: 0 0 1rem 0;
      font-size: 1.8rem;
    }
    .cnc-actions {
      display: flex;
      gap: 1rem;
    }
    .cnc-btn {
      padding: 1rem 2rem;
      border: none;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      color: white;
    }
    .btn-start { background: #00c853; }
    .btn-complete { background: #2962ff; }
    .btn-error { background: #d50000; }
    .btn-disabled { background: #555; cursor: not-allowed; }
    
    .cnc-materials {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
    }
    .cnc-materials h3 {
      margin-top: 0;
      color: #64ffda;
      border-bottom: 1px solid #333;
      padding-bottom: 0.5rem;
    }
    .material-item {
      background: #222;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .material-item .location {
      font-size: 1.5rem;
      font-weight: bold;
      color: #ffab00;
      background: #333;
      padding: 0.5rem 1rem;
      border-radius: 4px;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: #252525;
      padding: 2rem;
      border-radius: 8px;
      width: 500px;
      max-width: 90%;
    }
    .modal h2 { margin-top: 0; }
    .modal select, .modal textarea {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 1rem;
      background: #111;
      color: white;
      border: 1px solid #444;
    }
  </style>
</head>
<body>
  <div class="cnc-container">
    <header class="cnc-header">
      <h1>Magazyn - Monitor CNC</h1>
      <div class="cnc-worker-select">
        <label>Operator:</label>
        <select id="workerSelect">
          <option value="">Wybierz operatora...</option>
        </select>
        <input type="text" id="newWorkerName" placeholder="Nowy pracownik" style="width: 150px; display: none;" />
        <button id="addWorkerBtn" class="outline-action">+</button>
      </div>
      <div class="cnc-clock" id="clock">00:00:00</div>
    </header>
    
    <div class="cnc-content">
      <div class="cnc-queue">
        <h2>Kolejka rozkrojów</h2>
        <div class="cnc-job-list" id="jobQueue">
          <!-- Jobs injected here -->
        </div>
      </div>
      
      <div class="cnc-details">
        <div class="cnc-details-header">
          <h2 id="jobTitle">Wybierz rozkrój z kolejki</h2>
          <div class="cnc-actions" id="jobActions" style="display: none;">
            <button id="btnStart" class="cnc-btn btn-start">Rozpocznij</button>
            <button id="btnComplete" class="cnc-btn btn-complete" style="display: none;">Zakończ rozkrój</button>
            <button id="btnError" class="cnc-btn btn-error">Zgłoś Problem</button>
          </div>
        </div>
        
        <div class="cnc-materials" id="jobMaterials" style="display: none;">
          <h3>Płyty do pobrania (Całe arkusze)</h3>
          <div id="sheetsList"></div>
          
          <h3 style="margin-top: 2rem;">Zarezerwowane resztki (Pobierz ze stojaków)</h3>
          <div id="offcutsList"></div>
          <div style="margin-top: 1rem; padding: 1rem; background: #222; border-radius: 6px; border: 1px dashed #666;">
            <h4 style="margin-top: 0; color: #aaa;">Dobrałem inną resztkę / płytę</h4>
            <div style="display: flex; gap: 0.5rem;">
              <input type="text" id="extraOffcutId" placeholder="Wpisz lub zeskanuj ID..." style="flex: 1; padding: 0.5rem; background: #111; color: white; border: 1px solid #444;">
              <button id="btnAddExtraOffcut" class="outline-action" style="padding: 0.5rem 1rem;">Dodaj do zużycia</button>
            </div>
            <ul id="extraOffcutsList" style="margin-top: 0.5rem; padding-left: 1.5rem; color: #64ffda;"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="errorModal" class="modal">
    <div class="modal-content">
      <h2>Zgłoszenie problemu na CNC</h2>
      <select id="errorType">
        <option value="Uszkodzony materiał">Uszkodzony materiał z magazynu</option>
        <option value="Błąd rozkroju">Błąd na pile (źle ucięte)</option>
        <option value="Brak resztki">Brak zadeklarowanej resztki na stojaku</option>
        <option value="Inne">Inne</option>
      </select>
      <textarea id="errorDesc" rows="4" placeholder="Opcjonalny opis..."></textarea>
      <div style="display: flex; gap: 1rem; justify-content: flex-end;">
        <button id="btnCancelError" class="outline-action">Anuluj</button>
        <button id="btnSubmitError" class="primary-action">Wyślij Zgłoszenie</button>
      </div>
    </div>
  </div>

  <script src="cnc.js"></script>
</body>
</html>
